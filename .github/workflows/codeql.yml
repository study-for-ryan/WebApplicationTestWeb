name: CodeQL

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 3 * * 1'   # 每周一 UTC 3 点定时扫描

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          # 查询套件: default / security-extended / security-and-quality
          # security-and-quality 会额外包含质量类规则, 让 Code quality findings 更丰富
          queries: security-and-quality

      - name: Restore
        run: dotnet restore WebApplicationTestWeb.slnx

      - name: Build
        run: dotnet build WebApplicationTestWeb.slnx -c Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
